<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<style>
  :root { --paper: #F7F2E6; --ink: #1F1A15; --muted: #6B5F4D; --rule: #E2D8C3; --accent: #A8322A; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #14110E; --ink: #F2EADB; --muted: #A89C86; --rule: #3A332B; --accent: #E0604F; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink);
         font: 17px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 680px; margin: 0 auto; padding: 48px 20px 64px; }
  header { border-bottom: 1px solid var(--rule); padding-bottom: 16px; margin-bottom: 32px; }
  header a { color: var(--ink); text-decoration: none; font: 600 22px/1.2 Georgia, "Times New Roman", serif; }
  nav { margin-top: 8px; font-size: 15px; }
  nav a { color: var(--muted); margin-right: 16px; }
  h1 { font: 600 34px/1.2 Georgia, "Times New Roman", serif; margin: 0 0 8px; }
  h2 { font: 600 21px/1.3 Georgia, "Times New Roman", serif; margin: 36px 0 8px; }
  a { color: var(--accent); }
  .updated { color: var(--muted); font-size: 15px; }
  footer { margin-top: 56px; padding-top: 16px; border-top: 1px solid var(--rule); color: var(--muted); font-size: 14px; }
</style>
</head>
<body>
<main>
  <header>
    <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav><a href="{{ '/support/' | relative_url }}">Support</a><a href="{{ '/privacy/' | relative_url }}">Privacy</a></nav>
  </header>
  {{ content }}
  <footer>Platen Writer for iPhone and iPad.</footer>
</main>
</body>
</html>
